<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Anti Duplikat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="supabase.min.js"></script>
  <style>
    body { background-color: #111827; font-family: sans-serif; color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="p-6">

  <!-- LOGIN ADMIN (Password Lokal) -->
  <div id="login-admin" class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
    <h2 class="text-3xl font-bold mb-2 text-blue-400 text-center">Keamanan Admin</h2>
    <p class="text-gray-400 text-sm text-center mb-6">Masukkan kode rahasia Anda untuk membuka panel manajemen klien.</p>
    
    <input type="password" id="admin-password" placeholder="Kode Akses..." class="w-full p-3 mb-4 bg-gray-900 border border-gray-600 rounded-lg text-white font-bold text-center focus:border-blue-500 outline-none">
    
    <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all">Buka Gerbang Admin</button>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="dashboard-admin" class="hidden max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4 mt-4">
      <h1 class="text-2xl font-bold text-blue-400">Pusat Kendali Pelanggan (SaaS)</h1>
      <button onclick="location.reload()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold text-sm">Keluar / Kunci</button>
    </div>

    <!-- Tambah Klien Baru -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-8 shadow-lg">
      <h3 class="text-lg font-bold text-green-400 mb-4">➕ Tambah Klien Baru</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Kode Unik Gudang</label>
          <input type="text" id="new-kode" placeholder="Misal: JKT01" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white font-bold uppercase">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Nama Perusahaan/Gudang</label>
          <input type="text" id="new-nama" placeholder="PT Maju Bersama" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Berlaku Sampai</label>
          <input type="date" id="new-expire" class="w-full p-2 bg-gray-900 border border-gray-600 rounded text-white">
        </div>
        <div>
          <button onclick="tambahKlien()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded shadow transition">Buat Akses</button>
        </div>
      </div>
    </div>

    <!-- Daftar Klien -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg overflow-x-auto">
      <table class="w-full min-w-[700px] text-left border-collapse">
        <thead>
          <tr class="bg-gray-900 text-gray-400 text-sm border-b border-gray-700">
            <th class="p-4">Kode Gudang</th>
            <th class="p-4">Nama Pelanggan</th>
            <th class="p-4">Total Resi Di-Scan</th>
            <th class="p-4">Status & Masa Aktif</th>
            <th class="p-4 text-center">Aksi (Perpanjang/Blokir)</th>
          </tr>
        </thead>
        <tbody id="client-list" class="text-sm">
          <tr><td colspan="5" class="text-center p-8 text-gray-500">Memuat data pelanggan...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://znyvnmrnhepldmlesgqa.supabase.co';
    const anonKey = 'sb_publishable_3UlKBMCHIaxuTjJw0LdkKQ_xoqqdERr';
    
    // Gunakan Anon Key agar tidak diblokir oleh Server Supabase
    const _adminSupabase = supabase.createClient(supabaseUrl, anonKey);

    const tzOffset = (new Date()).getTimezoneOffset() * 60000;
    const nextMonth = new Date(Date.now() - tzOffset + (30 * 24 * 60 * 60 * 1000)).toISOString().slice(0, 10);
    document.getElementById('new-expire').value = nextMonth;

    function loginAdmin() {
      const pass = document.getElementById('admin-password').value.trim();
      if(pass !== 'ARIF92') { 
          alert("Kode Akses Salah!"); 
          return; 
      }
      document.getElementById('login-admin').classList.add('hidden');
      document.getElementById('dashboard-admin').classList.remove('hidden');
      loadClients();
    }

    async function loadClients() {
      const list = document.getElementById('client-list');
      list.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Menarik data dari Supabase...</td></tr>';
      
      const { data: clients, error } = await _adminSupabase.from('clients').select('*').order('created_at', { ascending: false });
      
      if (error) {
        list.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-500">Gagal memuat data: ' + error.message + '</td></tr>';
        return;
      }

      if (clients.length === 0) {
        list.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Belum ada pelanggan.</td></tr>';
        return;
      }

      list.innerHTML = '';
      
      for (const c of clients) {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-gray-700 hover:bg-gray-750 transition';
        
        const isExpired = new Date() > new Date(c.expired_at);
        let statusBadge = '';
        if (c.is_active === false) {
           statusBadge = '<span class="bg-red-900 text-red-300 px-2 py-1 rounded text-xs font-bold border border-red-700">DIBLOKIR</span>';
        } else if (isExpired) {
           statusBadge = '<span class="bg-yellow-900 text-yellow-300 px-2 py-1 rounded text-xs font-bold border border-yellow-700">KADALUARSA</span>';
        } else {
           statusBadge = '<span class="bg-green-900 text-green-300 px-2 py-1 rounded text-xs font-bold border border-green-700">AKTIF</span>';
        }

        const dateStr = new Date(c.expired_at).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});

        tr.innerHTML = ' \
          <td class="p-4 font-mono font-bold text-blue-400">' + c.kode + '</td> \
          <td class="p-4 font-bold">' + c.nama_gudang + '</td> \
          <td class="p-4 font-mono text-yellow-400" id="count-' + c.kode + '">Menghitung...</td> \
          <td class="p-4"> \
            ' + statusBadge + ' <br> \
            <span class="text-xs text-gray-400 mt-1 inline-block">S/d: ' + dateStr + '</span> \
          </td> \
          <td class="p-4 text-center space-x-2"> \
            <button onclick="perpanjang(\'' + c.kode + '\', \'' + c.expired_at + '\')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold">Perpanjang</button> \
            <button onclick="toggleBlokir(\'' + c.kode + '\', ' + c.is_active + ')" class="' + (c.is_active ? 'bg-red-600 hover:bg-red-500' : 'bg-green-600 hover:bg-green-500') + ' text-white px-3 py-1 rounded text-xs font-bold"> \
               ' + (c.is_active ? 'Blokir' : 'Buka Blokir') + ' \
            </button> \
          </td> \
        ';
        list.appendChild(tr);

        _adminSupabase.from('scans').select('id', { count: 'exact', head: true }).eq('seller_code', c.kode)
          .then(res => {
             document.getElementById('count-' + c.kode).innerText = (res.count || 0) + " Paket";
          });
      }
    }

    async function tambahKlien() {
      const kode = document.getElementById('new-kode').value.trim().toUpperCase();
      const nama = document.getElementById('new-nama').value.trim();
      const expire = document.getElementById('new-expire').value;

      if (!kode || !nama || !expire) { alert("Semua kolom harus diisi!"); return; }

      const expireFull = expire + 'T23:59:59+07:00';

      const { error } = await _adminSupabase.from('clients').insert([
        { kode: kode, nama_gudang: nama, expired_at: expireFull, is_active: true }
      ]);

      if (error) {
        if (error.code === '23505') alert("GAGAL: Kode Gudang tersebut sudah dipakai!");
        else alert("GAGAL: " + error.message);
      } else {
        document.getElementById('new-kode').value = '';
        document.getElementById('new-nama').value = '';
        loadClients();
      }
    }

    async function perpanjang(kode, currentTime) {
      const tglBaru = prompt("Masukkan tanggal kadaluwarsa baru untuk " + kode + ":\\nFormat: YYYY-MM-DD", currentTime.slice(0,10));
      if (!tglBaru) return;

      const expireFull = tglBaru + 'T23:59:59+07:00';
      const { error } = await _adminSupabase.from('clients').update({ expired_at: expireFull, is_active: true }).eq('kode', kode);
      
      if (error) alert("Gagal memperpanjang: " + error.message);
      else loadClients();
    }

    async function toggleBlokir(kode, is_active) {
      const action = is_active ? "memblokir" : "membuka blokir";
      if (!confirm("Yakin ingin " + action + " akun " + kode + "?")) return;

      const { error } = await _adminSupabase.from('clients').update({ is_active: !is_active }).eq('kode', kode);
      
      if (error) alert("Gagal: " + error.message);
      else loadClients();
    }
  </script>
</body>
</html>
